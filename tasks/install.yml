- name: Validate variables for install.yml task
  ansible.builtin.assert:
    that:
      - prometheus_version is defined
      - prometheus_user is defined
      - prometheus_dir is defined
      - prometheus_data_path is defined
      - prometheus_download_url is defined
      - prometheus_download_dir is defined
      - prometheus_bin_dir is defined

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0755"
  loop:
    - "{{ prometheus_dir }}"
    - "{{ prometheus_data_path }}"

- name: Download Prometheus
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "{{ prometheus_download_dir }}/prometheus.tar.gz"
    owner: root
    group: root
    mode: "0644"

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: "{{ prometheus_download_dir }}/prometheus.tar.gz"
    dest: "{{ prometheus_download_dir }}"
    remote_src: true

- name: Copy binaries
  ansible.builtin.copy:
    src: "{{ prometheus_download_dir }}/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "{{ prometheus_bin_dir }}/{{ item }}"
    mode: '0755'
    remote_src: true
  loop:
    - prometheus
    - promtool

- name: Delete installation artifacts
  ansible.builtin.file:
    name: "{{ item }}"
    state: absent
  loop:
    - "{{ prometheus_download_dir }}/prometheus.tar.gz"
    - "{{ prometheus_download_dir }}/prometheus-{{ prometheus_version }}.linux-amd64"

- name: Create systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"

- name: Enable prometheus service
  ansible.builtin.service:
    name: prometheus
    enabled: true
