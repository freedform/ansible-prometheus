- name: Validate prometheus_action_list
  ansible.builtin.assert:
    that:
      - prometheus_actions is defined
      - prometheus_actions is string
      - prometheus_actions | length > 0

- name: Create prometheus_action_list
  ansible.builtin.set_fact:
    prometheus_action_list: "{{ prometheus_actions.split(',') }}"

- name: Validate prometheus_action_list
  ansible.builtin.assert:
    that:
      - prometheus_action_list | length > 0
      - prometheus_action_list | difference(prometheus_supported_actions) | length == 0

- name: Deploy Prometheus
  ansible.builtin.include_tasks: "{{ task_name }}.yml"
  loop: "{{ prometheus_action_list }}"
  loop_control:
    loop_var: task_name
